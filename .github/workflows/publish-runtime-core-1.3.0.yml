name: publish-runtime-core-1.3.0

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Enable runtime-core 1.3.0 trusted publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Require release version
        run: node -e "const p=require('./package.json'); if(p.version!=='1.3.0') process.exit(1)"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Publish with npm trusted publishing
        run: npm publish --access public
