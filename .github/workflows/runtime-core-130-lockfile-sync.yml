name: runtime-core-130-lockfile-sync

on:
  push:
    branches:
      - trust/execution-evidence-v1

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trust/execution-evidence-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "commandlayer-ci"
          git config user.email "ci@commandlayer.org"
          git add package-lock.json
          git commit -m "Repair runtime-core 1.3.0 lockfile"
          git push origin HEAD:trust/execution-evidence-v1
